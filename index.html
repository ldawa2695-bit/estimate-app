<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EstiMate — Building Cost Estimator</title>
    <meta name="description" content="Quantity takeoff, BOQ costing, rate analysis and property valuation for Nepal building work." />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!--
      Open Graph / social share preview (Facebook, WhatsApp, etc.)
      IMPORTANT: og:image and twitter:image need a FULL absolute URL to
      work reliably on most platforms (a relative path like "/og-image.png"
      is not guaranteed to resolve correctly when a crawler fetches it).
      Once you have your real domain, replace YOURDOMAIN.com below with it,
      e.g. https://gharkharcha.com/og-image.png
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EstiMate — Building Cost Estimator" />
    <meta property="og:description" content="Free quantity takeoff, BOQ costing, rate analysis and property valuation for Nepal building work." />
    <meta property="og:image" content="https://YOURDOMAIN.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X card (falls back to the same image) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EstiMate — Building Cost Estimator" />
    <meta name="twitter:description" content="Free quantity takeoff, BOQ costing, rate analysis and property valuation for Nepal building work." />
    <meta name="twitter:image" content="https://YOURDOMAIN.com/og-image.png" />

    <!--
      Analytics — Cloudflare Web Analytics: genuinely free, no cookies, no
      consent banner needed, and doesn't require moving your domain's DNS
      to Cloudflare. Sign up free at dash.cloudflare.com -> Web Analytics ->
      Add a site, and it gives you a "beacon token" to paste below in place
      of YOUR_TOKEN_HERE. Until you do that, this script simply has nowhere
      to report to and won't cause any errors.
    -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "YOUR_TOKEN_HERE"}'></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
